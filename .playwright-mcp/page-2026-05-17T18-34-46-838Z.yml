    - generic [ref=e17]:
      - paragraph [ref=e18]: After three years of near-zero international travel, Cathay Pacific needed to remind the world why flying felt like something worth doing — and why Cathay, specifically, was the carrier worth doing it with.
      - generic [ref=e19]:
        - generic [ref=e20]: The Challenge
        - paragraph [ref=e21]: "The brief arrived with a deceptively simple phrase: \"Make people want to fly again.\" But behind it lay a more nuanced problem. Post-pandemic, travellers had sorted themselves into three groups: those who flew the moment borders reopened, those still hesitant, and those who had quietly decided the stress wasn't worth it."
        - paragraph [ref=e22]: Cathay had the routes, the lounges, the fleet upgrades. What it lacked was an emotional case — a reason to feel something about air travel beyond logistics. The airline had been running functional "where will you go" advertising for years. We needed to reset the emotional register entirely.
      - generic [ref=e23]:
        - generic [ref=e24]: Our Approach
        - paragraph [ref=e25]: "We identified a universal truth that every frequent flyer knows but rarely articulates: the best part of a journey is rarely the destination. It's the altitude. The silence at 39,000 feet. The way the world contracts and the mind expands. We called it \"The Feeling\" — a campaign built around the interior experience of flying rather than the exterior promise of arrival."
        - paragraph [ref=e26]: "Rather than a single hero film, we produced a modular creative system: 14 market-specific hero pieces, each filmed in natural light with local collaborators, connected by a common visual language and score. The campaign ran across OOH, digital video, CTV, social, and in-flight — a closed loop that caught passengers before, during, and after every journey."
      - generic [ref=e27]:
        - generic [ref=e28]: Execution
        - paragraph [ref=e29]: Production spanned 14 cities over 8 weeks, with local cinematographers shooting to a shared reference frame rather than a single director's vision. The result was a campaign that felt genuinely local in each market while remaining unmistakably cohesive.
        - paragraph [ref=e30]: "Media planning prioritised high-dwell environments: airport premium OOH, business class lounge digital screens, podcast pre-rolls for frequent business travellers. CTV ran 60-second cuts during streaming primetime in Hong Kong, London, and Sydney."
        - paragraph [ref=e31]: The campaign launched at the exact midpoint of the northern hemisphere summer — July 11th — timed to catch the second booking wave for August and September travel. Performance extensions on search and social closed the loop with booking-intent audiences identified from prior brand exposure.
