<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bars" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1f6e"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#04040a"/>

  <line x1="100" y1="280" x2="700" y2="280" stroke="#1c1c2e" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="100" y1="560" x2="700" y2="560" stroke="#1c1c2e" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- SECTION 1: LOGO MARK -->
  <text x="400" y="40" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" fill="#5a5870" text-anchor="middle" letter-spacing="3" font-weight="bold">LOGO MARK</text>
  <g transform="translate(300, 40)">
    <rect x="30" y="110" width="16" height="40" rx="4" fill="url(#grad-bars)"/>
    <rect x="55" y="80" width="16" height="70" rx="4" fill="url(#grad-bars)"/>
    <rect x="80" y="40" width="16" height="110" rx="4" fill="url(#grad-bars)"/>
    <rect x="105" y="20" width="16" height="150" rx="4" fill="url(#grad-bars)"/>
    <rect x="130" y="50" width="16" height="40" rx="4" fill="url(#grad-bars)"/>
    <rect x="155" y="65" width="16" height="25" rx="4" fill="url(#grad-bars)"/>
    <rect x="130" y="120" width="16" height="40" rx="4" fill="url(#grad-bars)"/>
    <rect x="155" y="120" width="16" height="15" rx="4" fill="url(#grad-bars)"/>
    <circle cx="138" cy="70" r="5" fill="#04040a"/>
  </g>

  <!-- SECTION 2: TYPOGRAPHY -->
  <text x="400" y="320" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" fill="#5a5870" text-anchor="middle" letter-spacing="3" font-weight="bold">TYPOGRAPHY</text>
  <g transform="translate(400, 430)">
    <text text-anchor="middle" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="72" font-weight="800" letter-spacing="-2">
      <tspan fill="#ede9de">mirahha</tspan><tspan fill="#ff1f6e">.</tspan>
    </text>
    <text y="40" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#9896b0" letter-spacing="6">DATA-DRIVEN MARKETING</text>
  </g>

  <!-- SECTION 3: COMBINATION MARK -->
  <text x="400" y="600" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" fill="#5a5870" text-anchor="middle" letter-spacing="3" font-weight="bold">COMBINATION MARK</text>
  <g transform="translate(190, 640)">
    <g transform="scale(0.5)">
      <rect x="30" y="110" width="16" height="40" rx="4" fill="url(#grad-bars)"/>
      <rect x="55" y="80" width="16" height="70" rx="4" fill="url(#grad-bars)"/>
      <rect x="80" y="40" width="16" height="110" rx="4" fill="url(#grad-bars)"/>
      <rect x="105" y="20" width="16" height="150" rx="4" fill="url(#grad-bars)"/>
      <rect x="130" y="50" width="16" height="40" rx="4" fill="url(#grad-bars)"/>
      <rect x="155" y="65" width="16" height="25" rx="4" fill="url(#grad-bars)"/>
      <rect x="130" y="120" width="16" height="40" rx="4" fill="url(#grad-bars)"/>
      <rect x="155" y="120" width="16" height="15" rx="4" fill="url(#grad-bars)"/>
      <circle cx="138" cy="70" r="5" fill="#04040a"/>
    </g>
    <text x="110" y="68" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="64" font-weight="800" letter-spacing="-2">
      <tspan fill="#ede9de">mirahha</tspan><tspan fill="#ff1f6e">.</tspan>
    </text>
  </g>
</svg>
